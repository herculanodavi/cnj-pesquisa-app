[project]
name = "cnj"
version = "0.1.0"
description = "Busca ACPs ambientais em cumprimento de sentença no TJCE (DataJud + e-SAJ)"
license = "0BSD"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "openpyxl>=3.1",
]

[project.scripts]
cnj = "cnj.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
